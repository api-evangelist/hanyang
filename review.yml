  - date: '2026-09-01'
    rating: 3
    method: probed
    summary: >-
      University-pipeline re-profile with operator attribution. Hanyang is one of the
      few institutions in this cohort that genuinely builds rather than buys: the HYU
      Open API Developer Center at api.hanyang.ac.kr is Hanyang's own code on Hanyang's
      own domain, with its own OAuth 2.0 authorization server, twelve service
      categories, Android/iOS SDKs and a complete published error-code table. It is
      also almost entirely closed: /api/search.page renders the API detail template
      with no rows to anonymous visitors, the console and community pages return the
      login form, and app keys need manual administrator approval, so no endpoint,
      scope or contract is enumerable from outside. The one openly callable
      institution-operated API is the OAI-PMH 2.0 interface on Hanyang's own DSpace
      host — and it is live but empty: Identify, ListMetadataFormats and ListSets
      answer correctly while ListIdentifiers, ListRecords and GetRecord return
      noRecordsMatch/idDoesNotExist for every prefix, set and date range probed,
      including the OpenAIRE context, even though the web UI and RSS feed serve items.
      Research outputs and theses are vendor tenancies (Bwise ScholarWorks per campus,
      KERIS dCollection) and are recorded as relationships, not as Hanyang contracts.
      DOI registration is Crossref at institute level (eight members, eight prefixes);
      DataCite has zero clients. Hanyang publishes no SAML IdP to KAFE or eduGAIN
      although eleven Korean peers do. No university-wide GitHub organization exists,
      only labs and student projects. The 2026-06-03 LinkedIn pointer is now a hard
      404 and has been removed. Nothing was fabricated and no vendor contract was
      saved.
