    summary: >-
      Hanyang University runs a genuine, officially branded API Developer
      Center at api.hanyang.ac.kr offering REST Open APIs (XML/JSON), OAuth
      authentication, Android/iOS SDKs, an API console, and a developer
      community. The developer-center landing and SDK pages return HTTP 200 and
      are publicly readable, but individual endpoints and Private (personal
      data) APIs are gated behind developer registration and HY-in/OAuth login,
      so they could not be enumerated. No official university-wide GitHub
      organization was found (only research labs and student projects), so no
      GitHub common pointer is claimed. The English homepage returns 403 to
      automated probes but is the confirmed official site. No endpoints were
      fabricated; only verified, publicly reachable URLs are recorded below.
