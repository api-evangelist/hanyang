  detail: >-
    Hanyang runs a real, institution-built Open API programme, but its API catalogue is
    behind a developer-center member account. /api/search.page returns HTTP 200 with the
    detail template rendered and no rows; /develop/console.page, /notice/list.page and
    /board/list.page all return the login form instead of content; app keys require manual
    administrator approval. The public documentation pages (getting started, authentication,
    error codes, app registration, Android/iOS SDKs, terms of service) are readable and were
    the source for the authentication, errors and rate-limit artifacts in this repo, but no
    endpoint, no scope name and no machine-readable contract can be enumerated from outside.
    The one openly callable institution-operated API found is the OAI-PMH interface on the
    university's own DSpace host, and it returns noRecordsMatch to every harvest request.
    Nothing here is blocked at our end; every probe below ran and returned.
