  - aid: hanyang:repository-oai-pmh
    name: Repository at Hanyang University — OAI-PMH
    x-operator: institution
    x-operator-evidence: >-
      repository.hanyang.ac.kr resolves under the institution's own registrable domain and
      is served from the university's own Apache/Rocky Linux host; OAI Identify returns
      repositoryName "Repository at Hanyang University" and adminEmail
      repository@hanyang.ac.kr. DSpace 5.5 is open-source software the university runs
      itself, not a vendor tenancy.
    description: >-
      OAI-PMH 2.0 metadata-harvesting interface on Hanyang's institutional DSpace
      repository, plus an OpenSearch 1.1 descriptor and RSS/Atom feeds. Twelve metadata
      formats are advertised (oai_dc, qdc, mods, mets, marc, etdms, xoai, dim, rdf, ore,
      didl, uketd_dc) and sets enumerate the university's communities and collections on
      Handle prefix 20.500.11754. IMPORTANT — the descriptive verbs work but the harvest
      verbs do not: ListIdentifiers, ListRecords and GetRecord returned noRecordsMatch or
      idDoesNotExist for every metadataPrefix, set and date range probed on 2026-09-01,
      and on the /oai/openaire context too, even though the web UI and RSS feed serve
      items. Recorded as live-but-empty, not as a working harvest source.
    humanURL: https://repository.hanyang.ac.kr/
