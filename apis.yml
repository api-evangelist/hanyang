aid: hanyang
name: Hanyang University
x-type: university
x-category: Private Research University
description: >-
  Hanyang University is a private research university in Seoul and Ansan (ERICA),
  South Korea, ROR https://ror.org/046865y68. Unusually for this cohort it operates
  a genuine, institution-built API programme rather than a set of vendor tenancies:
  the HYU Open API Developer Center at api.hanyang.ac.kr publishes REST endpoints
  returning XML or JSON across twelve service categories (academic records, campus
  life, administration, research, careers, library, alumni giving, volunteering and
  more), backed by its own OAuth 2.0 authorization server, Android and iOS SDKs, an
  API console, a developer community and a full published error-code table. The
  catch is that the API catalogue itself is member-only: /api/search.page renders an
  empty template to anonymous visitors and app keys are issued only after manual
  administrator approval, so no endpoint list, scope list or machine-readable
  contract is publicly enumerable. The one openly callable institution-operated API
  is the OAI-PMH 2.0 interface on Hanyang's own DSpace repository at
  repository.hanyang.ac.kr, which answers Identify, ListMetadataFormats and ListSets
  correctly but returned noRecordsMatch to every harvest request probed. Its
  research-output and thesis surfaces are vendor tenancies (ScholarWorks/Bwise,
  KERIS dCollection), it registers DOIs through eight institute-level Crossref
  memberships rather than centrally, and it publishes no SAML identity-provider
  metadata to KAFE or eduGAIN while eleven of its Korean peers do.
