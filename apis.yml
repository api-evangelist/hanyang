    description: >-
      Hanyang University's own Open API platform, built and run by the university rather
      than bought from a vendor. REST endpoints under https://api.hanyang.ac.kr/rs/ return
      XML or JSON, selected by file extension. The Developer Center's own menu lists twelve
      service categories: 공통 (common), 학사정보 (academic records), 한양광장, 대학생활
      (campus life), 대학소개, 행정정보 (administration), 연구정보 (research), 취업정보
      (careers), 학술정보 (library and scholarly), 경영정보, 발전기금 (giving) and 사회봉사
      (volunteering). APIs are classed Public (no personal data) or Private (personal data,
      end-user OAuth consent required). Individual endpoints are visible only to registered
      developer-center members, so the catalogue could not be enumerated.
