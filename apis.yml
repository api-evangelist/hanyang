aid: hanyang
name: Hanyang University
description: >-
  Hanyang University is a private research university in Seoul and Ansan, South
  Korea, ranked #162 in the QS World University Rankings 2025. It operates an
  official API Developer Center at api.hanyang.ac.kr that publishes REST-style
  Open APIs returning XML or JSON, with OAuth-based authentication, Android and
  iOS SDKs, an API testing console, and a developer community. Access to the
  Open APIs requires developer registration and authentication through the
  university's HY-in portal; individual endpoints and personal-data ("Private")
  APIs are gated behind that login, so they are not publicly enumerable.
